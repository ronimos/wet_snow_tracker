# pyproject.toml
# Configuration for type checkers and linters

[tool.pyright]
# Pyright/Pylance configuration
typeCheckingMode = "basic"  # Options: "off", "basic", "standard", "strict"
reportGeneralTypeIssues = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportPrivateImportUsage = false

# Ignore numpy/pandas type issues
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false

# Python version
pythonVersion = "3.9"
pythonPlatform = "All"

[tool.pylance]
# VS Code Pylance settings
typeCheckingMode = "basic"

[tool.mypy]
# MyPy configuration (if using mypy)
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

# Disable specific error codes that are problematic with numpy/pandas
disable_error_code = [
    "arg-type",
    "assignment",
    "return-value",
    "call-overload"
]

[[tool.mypy.overrides]]
# Ignore all numpy/pandas type issues
module = [
    "numpy.*",
    "pandas.*",
    "matplotlib.*"
]
ignore_errors = true

[tool.ruff]
# Ruff linter configuration (modern alternative to flake8)
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Enable/disable specific rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "E731",  # lambda assignment
]

[build-system]
# Build system requirements
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"
