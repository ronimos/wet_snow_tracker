[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wetting-front-tracker"
version = "0.1.0"
description = "ML-based wetting front stall prediction for avalanche forecasting"
authors = [
    {name = "Ron Simenhois", email = "ron@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["avalanche", "snowpack", "machine-learning", "forecasting", "snow-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "xarray>=2022.3.0",
    # SNOWPACK data handling
    "netCDF4>=1.5.0",
    # ML core
    "scikit-learn>=1.0.0",
    # Advanced ML models
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
    # Feature importance & interpretability (CRITICAL!)
    "shap>=0.41.0",
    # Visualization
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    # Utilities
    "joblib>=1.1.0",
    "tqdm>=4.60.0",
    "geopandas>=1.0.1",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "plotly>=6.5.0",
    "rasterio>=1.4.3",
    "rioxarray>=0.15.0",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pylint>=2.12.0",
]

# GPU-accelerated computing
gpu = [
    "cupy>=10.0.0",  # GPU arrays
]

# Deep learning (optional)
deep = [
    "torch>=1.10.0",
    "tensorflow>=2.8.0",
]

# All extras
all = [
    "wetting-front-tracker[dev,gpu,deep]",
]

[project.urls]
Homepage = "https://github.com/ronimos/wetting-front-tracker"
Documentation = "https://wetting-front-tracker.readthedocs.io"
Repository = "https://github.com/ronimos/wetting-front-tracker"
Issues = "https://github.com/ronimos/wetting-front-tracker/issues"

[project.scripts]
# Command-line tools
train-stall-predictor = "wetting_front_tracker.ml_data_collection.train_stall_predictor:main"
collect-ml-data = "wetting_front_tracker.ml_data_collection.collect_ml_data:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wetting_front_tracker*"]

[tool.setuptools.package-data]
wetting_front_tracker = ["py.typed"]

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--cov=wetting_front_tracker",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src/wetting_front_tracker"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.pylint.format]
max-line-length = 100
