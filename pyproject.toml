[project]
name = "wetting-snow-tracker"
version = "0.1.0"
description = "Wetting Front Tracker for wet snow avalanche analysis"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Itai and Ron"}
]
keywords = ["avalanche", "snowpack", "wet-snow", "forecasting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "bottleneck>=1.5.0",
    "dask>=2025.7.0",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "matplotlib>=3.10.5",
    "numba>=0.61.2",
    "numpy==2.2.6",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "python-dotenv>=1.1.1",
    "rasterio>=1.4.3",
    "rioxarray>=0.19.0",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "xarray>=2025.8.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "branca>=0.6.0",
    "beautifulsoup4>=4.14.2",
]

[project.optional-dependencies]
# Analysis tools
analysis = [
    "seaborn>=0.13.2",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
gpu = [
    "cupy-cuda12x", # Or cupy-cuda11x, depending on user's driver
]

# Testing dependencies
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "responses>=0.23.0",
    "requests-mock>=1.11.0",
    "faker>=19.0.0",
    "hypothesis>=6.82.0",
]

# Development dependencies
dev = [
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "ipython>=8.14.0",
    "pre-commit>=3.3.3",
]

# All optional dependencies
all = [
    "wetting-snow-tracker[analysis,test,dev]",
]

[project.scripts]
wft = "wetting_front_tracker.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/wetting-snow-tracker"
Repository = "https://github.com/yourusername/wetting-snow-tracker"
Documentation = "https://github.com/yourusername/wetting-snow-tracker#readme"
Issues = "https://github.com/yourusername/wetting-snow-tracker/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wetting_front_tracker"]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/wetting_front_tracker",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_api: marks tests that require API access",
    "requires_gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
# Timeout for tests (prevents hanging)
timeout = 300

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["src/wetting_front_tracker"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Black Configuration (Code Formatting)
# ============================================================================

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ============================================================================
# Ruff Configuration (Linting)
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F811"]

# ============================================================================
# MyPy Configuration (Type Checking)
# ============================================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when you want strict typing
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
