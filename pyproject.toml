[project]
name = "wetting-snow-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bottleneck>=1.5.0",
    "dask>=2025.7.0",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "matplotlib>=3.10.5",
    "numba>=0.61.2",
    "numpy==2.2.6",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "python-dotenv>=1.1.1",
    "rasterio>=1.4.3",
    "rioxarray>=0.19.0",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "xarray>=2025.8.0",
]

[project.optional-dependencies]
analysis = [
    "seaborn>=0.13.2",
    "cupy>=13.6.0",
]

[project.scripts]
main = "wetting_front_tracker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wetting_front_tracker"]


